apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace "pro.fileforge.app"
    compileSdkVersion 35

    defaultConfig {
        applicationId "pro.fileforge.app"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 2410
        versionName "2.4.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // ============ Signing Configurations ============
    // Reads keystore from environment variables or GitHub Secrets
    // For local development: create keystore.properties file
    // For CI/CD: set ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, ANDROID_STORE_PASSWORD
    //
    // Note: GitHub Actions substitutes an EMPTY STRING (not null) for a
    // secret that was never configured in the repo's Settings → Secrets.
    // A plain `!= null` check treats that empty string as "present", which
    // then fails deep inside keystore decoding with a confusing error. This
    // hasKeystoreSecret() check treats null AND blank the same way: "not
    // configured", and the build gracefully falls back to debug signing
    // instead of hard-failing — important for forks/PRs that don't have
    // access to the repo's secrets at all.
    def hasKeystoreSecret = {
        def v = System.env.ANDROID_KEYSTORE_BASE64
        return v != null && v.trim().length() > 0
    }

    signingConfigs {
        release {
            // Try to load from keystore.properties (local development)
            def keystoreProperties = new Properties()
            def keystorePropsFile = rootProject.file("keystore.properties")
            if (keystorePropsFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropsFile))
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
            // Override with environment variables if available (CI/CD)
            if (hasKeystoreSecret()) {
                // Decode base64 keystore. Uses the MIME decoder (not the
                // strict RFC 4648 decoder) because it tolerates embedded
                // newlines/whitespace — a very common source of a corrupted
                // keystore when the secret was created with plain `base64
                // file` (which line-wraps by default) instead of `base64 -w
                // 0 file`. The strict decoder silently produces garbage
                // bytes at each line break instead of failing loudly, which
                // then surfaces later as a cryptic
                // "Tag number over 30 is not supported" KeytoolException.
                def keystoreFile = file("${rootProject.buildDir}/release.keystore")
                keystoreFile.parentFile.mkdirs()
                def rawBase64 = System.env.ANDROID_KEYSTORE_BASE64.trim()
                def bytes = Base64.getMimeDecoder().decode(rawBase64)
                if (bytes.length < 100) {
                    throw new GradleException(
                        "ANDROID_KEYSTORE_BASE64 decoded to only ${bytes.length} bytes — " +
                        "this is not a valid keystore. Re-check the secret was generated with " +
                        "'base64 -w 0 your.keystore' (or 'base64 -i your.keystore | tr -d \"\\n\"' " +
                        "on macOS) and pasted in full, with no truncation."
                    )
                }
                new FileOutputStream(keystoreFile).write(bytes)
                storeFile keystoreFile
                storePassword System.env.ANDROID_STORE_PASSWORD
                keyAlias System.env.ANDROID_KEY_ALIAS
                keyPassword System.env.ANDROID_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Use release signing config if keystore is available, otherwise fall back to debug
            if (hasKeystoreSecret() || rootProject.file("keystore.properties").exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // Native media playback (ExoPlayer/Media3)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'

    // === Archive engines ===
    // Apache Commons Compress: TAR, TAR.GZ, TGZ, GZ, BZIP2, XZ, ZIP, 7z (incl. password)
    implementation 'org.apache.commons:commons-compress:1.26.2'
    // XZ for .xz support (LZMA)
    implementation 'org.tukaani:xz:1.10'
    // JunRAR for native RAR (RAR3 + RAR5 + password-protected)
    implementation 'com.github.junrar:junrar:7.5.5'
    // SLF4J — required by commons-compress + junrar at runtime.
    // Without an SLF4J binding on the classpath, R8 fails the release build
    // with "Missing class org.slf4j.impl.StaticLoggerBinder".
    // slf4j-api provides the API; slf4j-jdk14 binds it to java.util.logging.
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'org.slf4j:slf4j-jdk14:2.0.13'

    implementation project(':capacitor-android')
    implementation project(':capacitor-app')
    implementation project(':capacitor-haptics')
    implementation project(':capacitor-keyboard')
    implementation project(':capacitor-status-bar')
    implementation project(':capacitor-splash-screen')
    implementation project(':capacitor-preferences')
    implementation project(':capacitor-filesystem')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

apply from: 'capacitor.build.gradle'
